services:
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: lk-jwt-service
    restart: unless-stopped
    environment:
      - LIVEKIT_JWT_BIND=:8081
      - LIVEKIT_URL=wss://meet.egoidei.giize.com
      # Список доменов Matrix-серверов, которым разрешено создавать комнаты
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=matrix.egoidei.giize.com
      - LIVEKIT_KEY=${LIVEKIT_KEY}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET}
    #    ports:
    #      - "127.0.0.1:8081:8081"
    networks:
      - main-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: 50100
          port_range_end: 50200
          use_external_ip: false
          node_ip: 95.31.210.101
          enable_loopback_candidate: false
          turn_servers:
            - host: matrix.egoidei.giize.com
              port: 5349
              protocol: tls
              secret: "${TURN_SERVER_TOKEN}"
          stun_servers:
            - stun.l.google.com:19302
            - matrix.egoidei.giize.com:3478
        keys:
          ${LIVEKIT_KEY}: ${LIVEKIT_SECRET}
    ports:
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"
    networks:
      - main-net